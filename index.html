},{\"termino\":\"Protección ESD\",\"definicion\":\"Usar pulsera y tapete antiestático para prevenir daños por energía estática.\"},{\"termino\":\"Ventilación\",\"definicion\":\"Trabajar en un área bien ventilada, especialmente al usar aire comprimido o soluciones de limpieza.\"},{\"termino\":\"No Forzar Componentes\",\"definicion\":\"Nunca forzar componentes. Si algo no encaja, revise la orientación o el procedimiento.\"},{\"termino\":\"Uso de Aire Comprimido\",\"definicion\":\"Usar en ráfagas cortas y mantener la lata vertical; no usar aire de compresores industriales.\"}]","options":[]},{"id":"question-1756182663744-0.39557706116588753","type":"Selección múltiple con múltiples respuestas","question":"Según el texto, ¿cuáles de las siguientes acciones forman parte de la limpieza externa de equipos electrónicos?","correctAnswer":"[\"Limpiar carcasas, teclados y ratones con paño de microfibra y solución limpiadora suave.\",\"Usar aire comprimido para ranuras y puertos externos.\",\"Limpiar pantallas con productos específicos.\"]","options":["Actualizar el sistema operativo para eliminar archivos basura.","Desmontar el equipo para limpiar el procesador y la RAM.","Limpiar pantallas con productos específicos.","Limpiar carcasas, teclados y ratones con paño de microfibra y solución limpiadora suave.","Usar aire comprimido para ranuras y puertos externos."]},{"id":"question-1756182760456-0.4332700748166576","type":"Selección múltiple con múltiples respuestas","question":"Según el texto, ¿cuáles de las siguientes acciones son parte de la limpieza interna de componentes electrónicos?","correctAnswer":"[\"Desmontar cuidadosamente la CRU (si es seguro y autorizado)\",\"Usar aire comprimido a distancia y con ráfagas cortas para eliminar polvo de ventiladores y disipadores\",\"Limpiar los contactos con alcohol isopropílico (99%) y bastoncillos de algodón\"]","options":["Limpiar los contactos con alcohol isopropílico (99%) y bastoncillos de algodón","Usar aire comprimido a distancia y con ráfagas cortas para eliminar polvo de ventiladores y disipadores","Desmontar cuidadosamente la CRU (si es seguro y autorizado)","Aplicar aceite lubricante directamente a los ventiladores","Lavar los componentes con agua y jabón"]},{"id":"question-1756182886016-0.2671850123921147","type":"Lineal","question":"Relaciona cada factor ambiental con su impacto principal o recomendación para el cuidado de una CRU.","correctAnswer":"[{\"termino\":\"Polvo\",\"definicion\":\"Causa principal de sobrecalentamiento y cortocircuitos; se debe mantener el ambiente libre de él.\"},{\"termino\":\"Temperatura\",\"definicion\":\"Altas temperaturas aceleran la degradación de componentes; requiere buena ventilación y control.\"},{\"termino\":\"Humedad\",\"definicion\":\"La alta puede causar corrosión, la baja aumenta el riesgo de ESD; se deben mantener niveles moderados.\"},{\"termino\":\"Vibraciones\",\"definicion\":\"Pueden aflojar conexiones o dañar componentes; la CRU debe estar en una superficie estable.\"},{\"termino\":\"Contaminantes Químicos\",\"definicion\":\"Pueden corroer o dejar residuos en los componentes.\"}]","options":[]},{"id":"question-1756183195103-0.9478649120644871","type":"Complete","question":"La Descarga Electrostática (ESD) es una de las mayores amenazas ____ para los componentes electrónicos.","correctAnswer":"invisibles","options":[]},{"id":"question-1756183338430-0.25719593441528865","type":"Selección múltiple con múltiples respuestas","question":"¿Cuáles de las siguientes afirmaciones son principios básicos del Control y Protección de la Energía Estática (ESD)?","correctAnswer":"[\"La energía estática puede dañar componentes electrónicos sensibles de forma irreversible.\",\"La descarga puede ser imperceptible para el humano, pero fatal para el hardware.\",\"Es crucial disipar cualquier carga estática antes de manipular las CRU.\"]","options":["La descarga puede ser imperceptible para el humano, pero fatal para el hardware.","La energía estática puede dañar componentes electrónicos sensibles de forma irreversible.","Una descarga estática solo es peligrosa si el humano la siente.","La energía estática solo afecta a los componentes antiguos.","Es crucial disipar cualquier carga estática antes de manipular las CRU."]},{"id":"question-1756183442210-0.996732380173111","type":"Selección múltiple con múltiples respuestas","question":"¿Cuáles de las siguientes son medidas recomendadas para el control y la protección contra descargas electrostáticas (ESD)?","correctAnswer":"[\"Uso de pulsera antiestática conectada a tierra.\",\"Manipular componentes por los bordes, evitando tocar pinos o circuitos.\",\"Almacenar componentes en bolsas antiestáticas.\"]","options":["Uso de pulsera antiestática conectada a tierra.","Manipular componentes por los bordes, evitando tocar pinos o circuitos.","Trabajar en una superficie metálica sin conexión a tierra.","Almacenar componentes en bolsas antiestáticas.","Vestir ropa que genere mucha estática como lana o sintéticos."]}];
        let finalStudentScore = { correct: 0, total: 0 };

        const showAlert = (message) => {
            modalMessage.textContent = message;
            customModal.style.display = 'flex';
        };
        modalCloseBtn.addEventListener('click', () => {
            customModal.style.display = 'none';
        });

        // Re-usable evaluation logic, same as instructor's side
        const evaluateSingleQuestion = (block, questionData, mode = 'display') => {
            const { correctAnswer, type } = questionData;
            let userAnswer = '';
            let isCorrect = false;

            if (type === 'Selección múltiple con única respuesta' || type === 'Verdadero o Falso') {
                const selected = block.querySelector('input[type="radio"]:checked');
                userAnswer = selected ? selected.value : "";
                isCorrect = userAnswer.toLowerCase().trim() === correctAnswer.toLowerCase().trim();
            } else if (type === 'Selección múltiple con múltiples respuestas') {
                const selectedOptions = Array.from(block.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
                try {
                    const correctOptions = JSON.parse(correctAnswer);
                    userAnswer = selectedOptions.join(', ');
                    isCorrect = selectedOptions.length === correctOptions.length && selectedOptions.every(opt => correctOptions.includes(opt));
                } catch (e) { isCorrect = false; }
            } else if (type === 'Arrastrar y Soltar') {
                let correctMatches = 0;
                const pairs = JSON.parse(correctAnswer);
                block.querySelectorAll('.drop-definition').forEach(def => {
                    const droppedTitle = def.querySelector('.drag-title');
                    if (droppedTitle && droppedTitle.dataset.id === def.dataset.id) {
                        correctMatches++;
                    }
                });
                isCorrect = correctMatches === pairs.length;
                userAnswer = `${correctMatches} de ${pairs.length} parejas correctas.`;
            } else if (type === 'Enumerar') {
                const inputs = block.querySelectorAll('.enumerate-input');
                const totalPairs = inputs.length;
                let correctMatches = 0;
                let answers = [];
                inputs.forEach(input => {
                    const parentDiv = input.closest('.flex');
                    const definition = parentDiv.querySelector('div:last-child').textContent;
                    answers.push(`(${input.value || 'vacío'}) ${definition.substring(0, 25)}...`);
                    if (input.value === input.dataset.correctNumber) {
                        correctMatches++;
                    }
                });
                isCorrect = correctMatches === totalPairs;
                if (mode === 'pdf') {
                    userAnswer = `Correctas: ${correctMatches}, Incorrectas: ${totalPairs - correctMatches}`;
                } else {
                    userAnswer = answers.join('; ');
                }
            } else if (type === 'Listas') {
                const selects = block.querySelectorAll('.list-select');
                const totalPairs = selects.length;
                let correctMatches = 0;
                let answers = [];
                selects.forEach(select => {
                    const parentDiv = select.closest('.grid');
                    const definition = parentDiv.querySelector('div:last-child').textContent;
                    answers.push(`${select.value || 'vacío'} -> ${definition.substring(0, 25)}...`);
                    if (select.value === select.dataset.correctTerm) {
                        correctMatches++;
                    }
                });
                isCorrect = correctMatches === totalPairs;
                if (mode === 'pdf') {
                    userAnswer = `Correctas: ${correctMatches}, Incorrectas: ${totalPairs - correctMatches}`;
                } else {
                    userAnswer = answers.join('; ');
                }
            } else if (type === 'Lineal') {
                 const pairs = JSON.parse(correctAnswer);
                const totalPairs = pairs.length;
                const connections = JSON.parse(block.dataset.connections || '[]');
                let correctConnections = 0;
                connections.forEach(conn => {
                    const correctPair = pairs.find(p => p.termino === conn.startText);
                    if (correctPair && correctPair.definicion === conn.endText) {
                        correctConnections++;
                    }
                });
                isCorrect = correctConnections === totalPairs && connections.length === totalPairs;
                if (mode === 'pdf') {
                    userAnswer = `Correctas: ${correctConnections}, Incorrectas: ${connections.length - correctConnections}`;
                } else {
                    userAnswer = connections.map(c => `${c.startText} -> ${c.endText}`).join('; ');
                }
            }
            else {
                const input = block.querySelector('.user-answer-input');
                userAnswer = input ? input.value.trim() : "";
                isCorrect = userAnswer.toLowerCase().trim() === correctAnswer.toLowerCase().trim();
            }
            return { isCorrect, userAnswer };
        };

                    data.options.forEach((option, i) => {

                    });
                    html += '</div>';
                } else if (data.type === 'Verdadero o Falso') {
                    html += '<div class="space-y-2 mt-2">';
                    const vfColors = { 'Verdadero': { bg: 'bg-green-100', text: 'text-green-900', ring: 'focus:ring-green-500', check: 'text-green-600' }, 'Falso': { bg: 'bg-red-100', text: 'text-red-900', ring: 'focus:ring-red-500', check: 'text-red-600' } };
                    ['Verdadero', 'Falso'].forEach(option => {
                        const color = vfColors[option];
                        const optionId = `option-${data.id}-${option}`;
                        html += `<label for="${optionId}" class="flex items-center p-2 rounded-md shadow-sm cursor-pointer ${color.bg}"><input id="${optionId}" name="${data.id}" type="radio" value="${option}" class="h-4 w-4 ${color.check} border-gray-300 ${color.ring}"><span class="ml-3 block text-base font-medium ${color.text}">${option}</span></label>`;
                    });
                    html += '</div>';
                } else if (data.type === 'Selección múltiple con múltiples respuestas') {
                    html += '<div class="space-y-2 mt-2">';
                    const colors = [ { bg: 'bg-blue-100', text: 'text-blue-800', ring: 'focus:ring-blue-500', check: 'text-blue-600' }, { bg: 'bg-green-100', text: 'text-green-800', ring: 'focus:ring-green-500', check: 'text-green-600' }, { bg: 'bg-purple-100', text: 'text-purple-800', ring: 'focus:ring-purple-500', check: 'text-purple-600' }, { bg: 'bg-pink-100', text: 'text-pink-800', ring: 'focus:ring-pink-500', check: 'text-pink-600' }, { bg: 'bg-orange-100', text: 'text-orange-800', ring: 'focus:ring-orange-500', check: 'text-orange-600' }, ];
                    data.options.forEach((option, i) => {
                        const color = colors[i % colors.length];
                        const optionId = `option-${data.id}-${Math.random().toString(36).substring(7)}`;
                        html += `<div class="flex items-center p-2 rounded-md ${color.bg}"><input id="${optionId}" name="${data.id}" type="checkbox" value="${option}" class="h-4 w-4 ${color.check} border-gray-300 rounded ${color.ring}"><label for="${optionId}" class="ml-3 block text-base font-medium ${color.text}">${option}</label></div>`;
                    });
                    html += '</div>';
                } else if (data.type === 'Arrastrar y Soltar') {
                    const pairs = JSON.parse(data.correctAnswer);
                    const titles = (JSON.parse(JSON.stringify(pairs))).sort(() => Math.random() - 0.5);
                    const definitions = (JSON.parse(JSON.stringify(pairs))).sort(() => Math.random() - 0.5);

                    html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                                <div class="bg-white p-4 rounded-xl shadow-lg border border-blue-200">
                                    <h3 class="text-xl font-bold text-blue-700 mb-4 pb-2 border-b border-blue-100">Títulos</h3>
                                    <div class="flex flex-col gap-3" id="titles-col-${data.id}">`;
                    titles.forEach(item => {
                        html += `<div class="drag-title bg-blue-300 text-blue-900 px-4 py-3 rounded-lg shadow-md cursor-grab select-none" draggable="true" data-id="${item.termino}">${item.termino}</div>`;
                    });
                    html += `</div></div>
                                <div class="bg-white p-4 rounded-xl shadow-lg border border-indigo-200">
                                    <h3 class="text-xl font-bold text-indigo-700 mb-4 pb-2 border-b border-indigo-100">Definiciones</h3>
                                    <div class="flex flex-col gap-3">`;
                    definitions.forEach(item => {
                        html += `<div class="drop-definition bg-gray-100 text-gray-800 p-4 rounded-lg border-2 border-dashed border-gray-300 min-h-24 flex items-center justify-center text-center" data-id="${item.termino}">${item.definicion}</div>`;
                    });
                    html += `</div></div>
                            </div>`;
                } else if (data.type === 'Enumerar') {
                    const pairs = JSON.parse(data.correctAnswer);
                    const shuffledPairs = (JSON.parse(JSON.stringify(pairs))).sort(() => Math.random() - 0.5);
                    html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">`;
                    html += `<div class="space-y-2"><p class="text-xs font-semibold text-gray-500 mb-2">TÉRMINOS</p>`;
                    pairs.forEach((pair, i) => {
                        html += `<div class="text-base"><span class="font-bold text-red-600">${i + 1}.</span> ${pair.termino}</div>`;
                    });
                    html += `</div>`;
                    html += `<div class="space-y-3"><p class="text-xs font-semibold text-gray-500 mb-2">DEFINICIONES</p>`;
                    shuffledPairs.forEach(pair => {
                        const correctIndex = pairs.findIndex(p => p.termino === pair.termino);
                        html += `<div class="flex items-center gap-2"><input type="number" class="enumerate-input w-12 h-10 text-center font-bold border-2 border-indigo-300 rounded bg-indigo-50" data-correct-number="${correctIndex + 1}"><div class="text-base">${pair.definicion}</div></div>`;
                    });
                    html += `</div></div>`;
                } else if (data.type === 'Listas') {
                    const pairs = JSON.parse(data.correctAnswer);
                    const terms = (JSON.parse(JSON.stringify(pairs))).map(p => p.termino).sort(() => Math.random() - 0.5);
                    html += `<div class="space-y-3 mt-4">`;
                    pairs.forEach(pair => {
                        html += `<div class="grid grid-cols-2 gap-4 items-center">
                                    <select class="list-select block w-full px-2 py-2 bg-blue-50 border-2 border-blue-300 rounded-md text-blue-700 font-semibold" data-correct-term="${pair.termino}">
                                        <option value="">Seleccione...</option>`;
                        terms.forEach(term => {
                            html += `<option value="${term}">${term}</option>`;
                        });
                        html += `</select>
                                    <div class="text-sm">${pair.definicion}</div>
                                </div>`;
                    });
                    html += `</div>`;
                } else if (data.type === 'Lineal') {
                    const pairs = JSON.parse(data.correctAnswer);
                    const terms = (JSON.parse(JSON.stringify(pairs.map(p => p.termino)))).sort(() => Math.random() - 0.5);
                    const definitions = (JSON.parse(JSON.stringify(pairs.map(p => p.definicion)))).sort(() => Math.random() - 0.5);

                    html += `<div class="lineal-container mt-4">
                        <svg class="lineal-svg" id="svg-${data.id}"></svg>
                        <div class="grid grid-cols-2 gap-8 relative z-10">
                            <div class="space-y-4" id="lineal-terms-${data.id}">`;
                    terms.forEach((term, i) => {
                        html += `<div class="flex items-center gap-3">
                                            <div class="line-handle" data-id="term-${i}" data-text="${term}" data-type="term"></div>
                                            <div class="text-sm p-2 bg-blue-100 rounded-md w-full">${term}</div>
                                        </div>`;
                    });
                    html += `</div><div class="space-y-4" id="lineal-defs-${data.id}">`;
                    definitions.forEach((definition, i) => {
                         html += `<div class="flex items-center gap-3">
                                            <div class="text-sm p-2 bg-green-100 rounded-md w-full text-right">${definition}</div>
                                            <div class="line-handle" data-id="def-${i}" data-text="${definition}" data-type="definition"></div>
                                        </div>`;
                    });
                    html += `</div></div></div>`;
                }
                else {
                    html += `<div class="mt-2"><input type="text" class="user-answer-input block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-base" placeholder="Escriba su respuesta aquí..."></div>`;
                }
                html += '<div class="feedback-area mt-3 text-base font-medium"></div>';
                html += '<div class="mt-4 h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 rounded-full"></div>';
                block.innerHTML = html;
                studentQuestionsList.appendChild(block);
            });
        };

        const loadEvaluation = () => {
            if (Array.isArray(studentQuestions) && studentQuestions.length > 0) {
                renderStudentQuestions();
                initLinealQuestions();
                initDragAndDropQuestions();
                finishEvaluationBtn.classList.remove('hidden');
            } else {
                noEvaluationMessage.classList.remove('hidden');
            }
        };

        finishEvaluationBtn.addEventListener('click', () => {
            if (!studentDetailsForm.checkValidity()) {
                showAlert('Por favor, complete todos los campos del encabezado antes de finalizar.');
                return;
            }
            let correctAnswers = 0;
            let allAnswered = true;
            const questionBlocks = document.querySelectorAll('.question-block-student');
            
            questionBlocks.forEach(block => {
                block.style.border = '1px solid #e5e7eb'; // Reset border
                const questionType = studentQuestions[block.dataset.index].type;
                let answered = false;
                if (questionType === 'Selección múltiple con única respuesta' || questionType === 'Verdadero o Falso') {
                    if (block.querySelector('input[type="radio"]:checked')) answered = true;
                } else if (questionType === 'Selección múltiple con múltiples respuestas') {
                    if (block.querySelectorAll('input[type="checkbox"]:checked').length > 0) answered = true;
                } else if (questionType === 'Arrastrar y Soltar') {
                    const titlesColumn = block.querySelector('[id^="titles-col-"]');
                    const titlesLeft = titlesColumn ? titlesColumn.querySelectorAll('.drag-title').length : -1;
                    if (titlesLeft === 0) answered = true;
                } else if (questionType === 'Enumerar') {
                    const inputs = block.querySelectorAll('.enumerate-input');
                    if (Array.from(inputs).every(input => input.value.trim() !== '')) answered = true;
                } else if (questionType === 'Listas') {
                    const selects = block.querySelectorAll('.list-select');
                    if (Array.from(selects).every(select => select.value.trim() !== '')) answered = true;
                } else if (questionType === 'Lineal') {
                    const connections = JSON.parse(block.dataset.connections || '[]');
                    if (connections.length > 0) answered = true;
                }
                else {
                    const input = block.querySelector('.user-answer-input');
                    if (input && input.value.trim() !== '') answered = true;
                }
                if (!answered) {
                    allAnswered = false;
                    block.style.border = '2px solid red';
                }
            });

            if (!allAnswered) {
                showAlert('Por favor, responda todas las preguntas antes de finalizar la evaluación.');
                return;
            }

            questionBlocks.forEach(block => {
                const questionIndex = parseInt(block.dataset.index, 10);
                const questionData = studentQuestions[questionIndex];
                const feedbackArea = block.querySelector('.feedback-area');
                
                const { isCorrect } = evaluateSingleQuestion(block, questionData);

                if (isCorrect) {
                    correctAnswers++;
                    feedbackArea.innerHTML = '<p class="font-bold text-green-600">✓ Correcto</p>';
                } else {
                    let correctDisplay = '';
                     if (['Enumerar', 'Listas', 'Lineal'].includes(questionData.type)) {
                        const pairs = JSON.parse(questionData.correctAnswer);
                        correctDisplay = '<p class="font-bold text-red-600 text-left">✗ Incorrecto. Las respuestas correctas son:</p><ul class="list-disc list-inside text-left mt-2 text-sm">';
                        pairs.forEach(pair => {
                            correctDisplay += `<li><span class="font-semibold">${pair.termino}</span>: ${pair.definicion}</li>`;
                        });
                        correctDisplay += '</ul>';
                    } else if (questionData.type === 'Arrastrar y Soltar') {
                         correctDisplay = `<p class="font-bold text-red-600">✗ Incorrecto. Revisar el orden/selección correcta.</p>`;
                    }
                    else {
                        let answer = questionData.correctAnswer;
                        try {
                           answer = JSON.parse(answer).join(', ');
                        } catch(e){}
                        correctDisplay = `<p class="font-bold text-red-600">✗ Incorrecto. La respuesta correcta es: "${answer}"</p>`;
                    }
                    feedbackArea.innerHTML = correctDisplay;
                }
                
                // Disable inputs
                block.querySelectorAll('input, select, .line-handle').forEach(el => {
                    el.disabled = true;
                    el.style.pointerEvents = 'none';
                });
                block.querySelectorAll('.drag-title').forEach(item => item.draggable = false);
            });
            
            finalStudentScore = { correct: correctAnswers, total: studentQuestions.length };
            const score = finalStudentScore.correct / finalStudentScore.total;
            let message = `Tu puntuación: ${finalStudentScore.correct} de ${finalStudentScore.total}. `;
            if (score >= 0.6) {
                message += "¡Excelente trabajo, has aprobado la evaluación! Felicitaciones.";
            } else {
                message += "Sigue esforzándote, ¡la próxima vez lo harás mejor!";
            }
            finalScoreText.textContent = message;
            finalScoreContainer.classList.remove('hidden');
            finishEvaluationBtn.classList.add('hidden');
            generateStudentPdfBtn.classList.remove('hidden');
        });

        generateStudentPdfBtn.addEventListener('click', () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            const pageWidth = doc.internal.pageSize.getWidth();
            const headerHeight = 40; // Height of the blue header bar

            // Draw the blue background
            doc.setFillColor(79, 70, 229); // A nice indigo color like 'bg-indigo-600'
            doc.rect(0, 0, pageWidth, headerHeight, 'F');

            // Set text color to white for the header
            doc.setTextColor(255, 255, 255);

            // Draw the header text
            doc.setFontSize(18);
            doc.setFont(undefined, 'bold');
            doc.text("Resultado de la Evaluación", pageWidth / 2, 15, { align: 'center' });

            doc.setFontSize(12);
            doc.setFont(undefined, 'normal');
            doc.text("Programa SENATIC", pageWidth / 2, 24, { align: 'center' });
            doc.text("Técnico en Sistemas Teleinformáticos", pageWidth / 2, 31, { align: 'center' });

            // Reset text color for the rest of the document
            doc.setTextColor(0, 0, 0);


            const headerData = [
                { title: "Competencia", value: document.getElementById('form_competencia').value },
                { title: "Rap", value: document.getElementById('form_rap').value },
                { title: "Tipo de Instrumento", value: document.getElementById('form_instrumento').value },
                { title: "Tema a Evaluar", value: document.getElementById('form_tema').value },
                { title: "Fecha", value: document.getElementById('form_fecha').value },
                { title: "Ficha", value: document.getElementById('form_ficha').value },
                { title: "Instructor", value: "Rafael Montes Martínez" },
                { title: "Aprendiz", value: document.getElementById('studentName').value },
            ];
            
            let currentY = headerHeight + 10;
            const leftMargin = 14;
            const rightMargin = 14;

            doc.setFontSize(10);
            doc.setFont(undefined, 'bold');

            // --- START of change ---
            // 1. Calculate the maximum width of all titles to align the values
            let maxTitleWidth = 0;
            headerData.forEach(item => {
                const titleText = item.title + ':';
                const width = doc.getTextWidth(titleText);
                if (width > maxTitleWidth) {
                    maxTitleWidth = width;
                }
            });

            // 2. Define a consistent starting X position for all values
            const valueX = leftMargin + maxTitleWidth + 4; // Add a bit more padding

            headerData.forEach(item => {
                const titleText = item.title + ':';
                const valueText = item.value || '';

                // Draw title
                doc.setFont(undefined, 'bold');
                doc.text(titleText, leftMargin, currentY, { align: 'left' });
                
                // Calculate height required for value text with wrapping
                const splitValue = doc.splitTextToSize(valueText, pageWidth - rightMargin - valueX - 2);
                const valueHeight = doc.getTextDimensions(splitValue).h;
                const cellHeight = Math.max(6, valueHeight + 2);

                // Draw background rectangle
                doc.setFillColor(239, 246, 255); // bg-blue-50
                doc.rect(valueX, currentY - 4, pageWidth - rightMargin - valueX, cellHeight, 'F');

                // Draw value text
                doc.setFont(undefined, 'normal');
                doc.text(splitValue, valueX + 1, currentY);

                currentY += cellHeight + 1;
            });
            // --- END of change ---


            const tableData = studentQuestions.map((question, index) => {
                const block = document.querySelectorAll('.question-block-student')[index];
                const { isCorrect, userAnswer } = evaluateSingleQuestion(block, studentQuestions[index], 'pdf');
                return [ index + 1, question.question, userAnswer || "Sin respuesta", isCorrect ? 'Correcto' : 'Incorrecto' ];
            });

            doc.autoTable({
                head: [['#', 'Pregunta', 'Respuesta', 'Resultado']],
                body: tableData,
                startY: currentY + 5,
                headStyles: { fillColor: [79, 70, 229] },
                styles: { cellPadding: 2, fontSize: 9 },
                columnStyles: { 0: { cellWidth: 10 }, 1: { cellWidth: 80 }, 2: { cellWidth: 'auto' }, 3: { cellWidth: 25 } },
                didDrawCell: (data) => {
                    if (data.section === 'body' && data.column.index === 3) {
                        let fillColor;
                        if (data.cell.text[0] === 'Correcto') {
                            fillColor = [220, 250, 220]; // soft green
                        } else if (data.cell.text[0] === 'Incorrecto') {
                            fillColor = [255, 220, 220]; // soft red
                        }
                        
                        if (fillColor) {
                            doc.setFillColor(...fillColor);
                            doc.rect(data.cell.x, data.cell.y, data.cell.width, data.cell.height, 'F');
                            doc.setTextColor(0, 0, 0);
                            const textY = data.cell.y + data.cell.height / 2;
                            doc.text(data.cell.text, data.cell.x + 2, textY, { baseline: 'middle' });
                        }
                    }
                }
            });

            const finalY = doc.lastAutoTable.finalY;
            
            const score = finalStudentScore.correct / finalStudentScore.total;
            let message = `Puntuación: ${finalStudentScore.correct} de ${finalStudentScore.total}. `;
             if (score >= 0.6) { message += "Aprobado. ¡Felicitaciones!"; } else { message += "No aprobado. ¡Sigue esforzándote!"; }

            const boxMargin = 14;
            const boxWidth = pageWidth - (boxMargin * 2);
            const boxHeight = 20;
            const boxX = boxMargin;
            const boxY = finalY + 15;

            doc.setFillColor(253, 224, 71); // yellow-300
            doc.roundedRect(boxX, boxY, boxWidth, boxHeight, 3, 3, 'F');

            doc.setFontSize(14);
            doc.setTextColor(score >= 0.6 ? '#16a34a' : '#dc2626'); // green-600 or red-600
            doc.setFont(undefined, 'bold');
            
            doc.text(message, pageWidth / 2, boxY + boxHeight / 2, { 
                align: 'center', 
                valign: 'middle' 
            });

            doc.save('mis_resultados.pdf');
        });

        // --- Lineal Question Logic ---
        function initLinealQuestions() {
            document.querySelectorAll('.lineal-container').forEach(container => {
                let drawingLine = { isActive: false, startX: 0, startY: 0, endX: 0, endY: 0, startElement: null };
                const svg = container.querySelector('.lineal-svg');
                const questionBlock = container.closest('.question-block-student');
                let connections = [];

                const getHandleCenter = (handle) => {
                    const rect = handle.getBoundingClientRect();
                    const containerRect = container.getBoundingClientRect();
                    return {
                        x: rect.left + rect.width / 2 - containerRect.left,
                        y: rect.top + rect.height / 2 - containerRect.top
                    };
                };

                const drawLines = () => {
                    svg.innerHTML = ''; // Clear previous lines
                    connections.forEach(conn => {
                        const startPos = getHandleCenter(conn.startElement);
                        const endPos = getHandleCenter(conn.endElement);
                        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        line.setAttribute('x1', startPos.x);
                        line.setAttribute('y1', startPos.y);
                        line.setAttribute('x2', endPos.x);
                        line.setAttribute('y2', endPos.y);
                        line.setAttribute('stroke', '#10b981');
                        line.setAttribute('stroke-width', '3');
                        svg.appendChild(line);
                    });

                    if (drawingLine.isActive) {
                        const tempLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        tempLine.setAttribute('x1', drawingLine.startX);
                        tempLine.setAttribute('y1', drawingLine.startY);
                        tempLine.setAttribute('x2', drawingLine.endX);
                        tempLine.setAttribute('y2', drawingLine.endY);
                        tempLine.setAttribute('stroke', '#6366f1');
                        tempLine.setAttribute('stroke-width', '3');
                        tempLine.setAttribute('stroke-dasharray', '5,5');
                        svg.appendChild(tempLine);
                    }
                };

                const handleMouseMove = (e) => {
                    if (!drawingLine.isActive) return;
                    const containerRect = container.getBoundingClientRect();
                    drawingLine.endX = e.clientX - containerRect.left;
                    drawingLine.endY = e.clientY - containerRect.top;
                    drawLines();
                };

                const handleMouseUp = (e) => {
                    if (!drawingLine.isActive) return;
                    
                    const endElement = e.target.classList.contains('line-handle') ? e.target : null;

                    if (endElement && endElement !== drawingLine.startElement && endElement.dataset.type !== drawingLine.startElement.dataset.type) {
                        // Remove any existing connection from either handle
                        connections = connections.filter(c => c.startElement !== drawingLine.startElement && c.endElement !== drawingLine.startElement && c.startElement !== endElement && c.endElement !== endElement);
                        
                        // Add new connection
                        connections.push({ startElement: drawingLine.startElement, endElement: endElement });
                        
                        // Update connected status for styling
                        container.querySelectorAll('.line-handle').forEach(h => h.classList.remove('connected'));
                        connections.forEach(c => {
                            c.startElement.classList.add('connected');
                            c.endElement.classList.add('connected');
                        });

                        // Store connections in the dataset for evaluation
                        const serializableConnections = connections.map(c => ({
                            startText: c.startElement.dataset.text,
                            endText: c.endElement.dataset.text
                        }));
                        questionBlock.dataset.connections = JSON.stringify(serializableConnections);

                    }
                    
                    drawingLine.isActive = false;
                    drawLines();
                    document.removeEventListener('mousemove', handleMouseMove);
                    document.removeEventListener('mouseup', handleMouseUp);
                };

                container.querySelectorAll('.line-handle').forEach(handle => {
                    handle.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        const startPos = getHandleCenter(handle);
                        drawingLine = {
                            isActive: true,
                            startX: startPos.x,
                            startY: startPos.y,
                            endX: startPos.x,
                            endY: startPos.y,
                            startElement: handle
                        };
                        document.addEventListener('mousemove', handleMouseMove);
                        document.addEventListener('mouseup', handleMouseUp);
                    });
                });
            });
        }
        
        // --- Drag & Drop Question Logic ---
        function initDragAndDropQuestions() {
            let draggedId = null;
            
            document.querySelectorAll('.drag-title').forEach(title => {
                title.addEventListener('dragstart', (e) => {
                    draggedId = e.target.dataset.id;
                    e.target.classList.add('dragging');
                });
                title.addEventListener('dragend', (e) => {
                    e.target.classList.remove('dragging');
                    draggedId = null;
                });
            });

            document.querySelectorAll('.drop-definition').forEach(def => {
                def.addEventListener('dragover', (e) => e.preventDefault());
                def.addEventListener('dragenter', (e) => e.target.classList.add('hovering'));
                def.addEventListener('dragleave', (e) => e.target.classList.remove('hovering'));
                def.addEventListener('drop', (e) => {
                    e.preventDefault();
                    e.target.classList.remove('hovering');
                    const questionBlock = e.target.closest('.question-block-student');
                    const draggedElement = questionBlock.querySelector(`.drag-title[data-id="${draggedId}"]`);
                    
                    if (!draggedElement) return;

                    // If drop target already has a title, return it to the list
                    const existingTitle = e.target.querySelector('.drag-title');
                    if (existingTitle) {
                        questionBlock.querySelector(`#titles-col-${studentQuestions[questionBlock.dataset.index].id}`).appendChild(existingTitle);
                    }
                    
                    // Append the new title
                    e.target.appendChild(draggedElement);
                });
            });
        }

        document.addEventListener('DOMContentLoaded', loadEvaluation);
    </script>
